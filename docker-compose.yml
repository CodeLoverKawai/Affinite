version: '3.8'

services:
  affine-db:
    image: postgres:15-alpine
    container_name: Affine-DB
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-affine_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-affine_pass}
      - POSTGRES_DB=${DB_NAME:-affine_db}
    volumes:
      - ${DB_DATA_VOLUME:-./data/db}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 456M

  affine-redis:
    image: redis:7-alpine
    container_name: Affine-Redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  affine:
    image: rousseaukairos/affinite:latest
    container_name: Affine-Canvas
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AFFINE_CONFIG_PATH=/root/.affine/config
      - DATABASE_URL=postgresql://${DB_USER:-affine_user}:${DB_PASSWORD:-affine_pass}@affine-db:5432/${DB_NAME:-affine_db}
      - REDIS_SERVER_HOST=affine-redis
      - REDIS_SERVER_PORT=6379
      - AFFINE_SERVER_PORT=5320
      - AFFINE_SERVER_EXTERNAL_URL=${AFFINE_EXTERNAL_URL:-http://localhost:5320}
      # Local Ollama connection configuration (points to the host system Ollama service)
      - COPILOT_OPENAI_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - COPILOT_OPENAI_API_KEY=${OLLAMA_API_KEY:-ollama}
    volumes:
      - ${AFFINE_STORAGE_VOLUME:-./data/storage}:/root/.affine/storage
      - ${AFFINE_CONFIG_VOLUME:-./data/config}:/root/.affine/config
    ports:
      - "${AFFINE_PORT_BINDING:-127.0.0.1:5320}:5320"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      - "io.portainer.stack.name=stacksis"
    deploy:
      resources:
        limits:
          memory: 1536M
    depends_on:
      affine-db:
        condition: service_healthy
      affine-redis:
        condition: service_healthy
