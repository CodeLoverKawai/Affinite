name: Build Windows Desktop Installer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'stable'
        type: choice
        options:
          - 'stable'
          - 'canary'
          - 'beta'
      create_release:
        description: 'Upload directly to GitHub Releases (if run on a tag or manual release)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Installer (${{ github.event.inputs.build_type || 'stable' }})
    runs-on: windows-latest
    permissions:
      contents: write
      actions: read

    env:
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'stable' }}
      DISTRIBUTION: desktop
      HOIST_NODE_MODULES: '1'
      SKIP_WEB_BUILD: '0'
      NODE_OPTIONS: '--max-old-space-size=8192'
      YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
      HUSKY: '0'

    steps:
      - name: Enable Git Symlinks for Windows
        run: git config --global core.symlinks true
        shell: pwsh

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & Yarn Berry
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
        shell: pwsh

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Install Monorepo Dependencies
        run: yarn install --no-immutable
        shell: pwsh

      - name: Build Native Rust Bindings (@affine/native)
        run: yarn affine @affine/native build
        shell: pwsh

      - name: Build Web Renderer and Electron Layer
        run: |
          $env:BUILD_TYPE = "${{ github.event.inputs.build_type || 'stable' }}"
          $env:DISTRIBUTION = "desktop"
          yarn affine @affine/electron build
          yarn affine @affine/electron generate-assets
        shell: pwsh

      - name: Reconfigure Yarn Hoisting for Electron Packaging
        run: |
          yarn config set nmMode classic
          yarn config set nmHoistingLimits workspaces
          Get-ChildItem -Path . -Filter node_modules -Recurse -Directory | ForEach-Object { Remove-Item -Recurse -Force $_.FullName -ErrorAction SilentlyContinue }
          yarn install --no-immutable
        shell: pwsh

      - name: Package Electron Application
        env:
          SKIP_WEB_BUILD: '1'
          SKIP_GENERATE_ASSETS: '1'
        run: |
          $env:BUILD_TYPE = "${{ github.event.inputs.build_type || 'stable' }}"
          $env:SKIP_WEB_BUILD = "1"
          $env:SKIP_GENERATE_ASSETS = "1"
          $env:HOIST_NODE_MODULES = "1"
          yarn affine @affine/electron package
        shell: pwsh

      - name: Build NSIS Installer (.exe)
        env:
          SKIP_WEB_BUILD: '1'
        run: |
          $env:BUILD_TYPE = "${{ github.event.inputs.build_type || 'stable' }}"
          $env:SKIP_WEB_BUILD = "1"
          yarn affine @affine/electron make-nsis
        shell: pwsh

      - name: Build Squirrel Installer (Setup.exe & RELEASES)
        env:
          SKIP_WEB_BUILD: '1'
        run: |
          $env:BUILD_TYPE = "${{ github.event.inputs.build_type || 'stable' }}"
          $env:SKIP_WEB_BUILD = "1"
          yarn affine @affine/electron make-squirrel
        shell: pwsh

      - name: Build Portable ZIP Package
        env:
          SKIP_WEB_BUILD: '1'
        run: |
          $env:BUILD_TYPE = "${{ github.event.inputs.build_type || 'stable' }}"
          $env:SKIP_WEB_BUILD = "1"
          yarn affine @affine/electron make
        shell: pwsh

      - name: Collect Windows Output Artifacts
        id: collect-artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist-windows
          Get-ChildItem -Path packages/frontend/apps/electron/out -Recurse -File -Include "*.exe","*.nupkg","*.zip","RELEASES","*.msi" | Copy-Item -Destination dist-windows/
          Get-ChildItem -Path dist-windows
        shell: pwsh

      - name: Upload Windows Installers as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AFFiNITe-Windows-${{ env.BUILD_TYPE }}-x64
          path: dist-windows/*
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-windows/*
          draft: false
          prerelease: ${{ env.BUILD_TYPE != 'stable' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
