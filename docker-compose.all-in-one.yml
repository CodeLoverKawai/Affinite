version: '3.8'

services:
  affinite:
    image: rousseaukairos/affinite:all-in-one
    container_name: Affinite-AllInOne
    restart: unless-stopped
    ports:
      - "${AFFINE_PORT_BINDING:-5320}:5320"
    environment:
      - NODE_ENV=production
      - AFFINE_SERVER_EXTERNAL_URL=${AFFINE_EXTERNAL_URL:-http://localhost:5320}
      - COPILOT_OPENAI_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      - COPILOT_OPENAI_API_KEY=${OLLAMA_API_KEY:-ollama}
    volumes:
      - ${AFFINE_DATA_VOLUME:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2048M
